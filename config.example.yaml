# rag-router Konfiguration (Beispiel)
# Verzeichnis: db-Pfade relativ zu DIESER Datei.
#
# Drei Entscheidungswege (decision_route): laya | slm | hybrid | auto.
#   laya   - Laya-Checkpoint (lokal, kein Endpunkt; Default)
#   slm    - OpenAI-kompatibles SLM (logprobs)
#   hybrid - beide (cascade/committee)
#   auto   - Messung waehlt den besten Weg und kalibriert die Schwellen
#
# Das Beispiel startet mit 'laya' (laeuft offline ohne Endpunkt). Fuer slm/
# hybrid/auto die markierten Bloecke einkommentieren und die generischen
# ${RR_ROUTER_SLM_*}-Variablen setzen. Schwellen: Zahl ODER 'auto'.

router:
  decision_route: laya          # laya | slm | hybrid | auto
  answer_backend: auto          # auto | laya | slm
  language: multilingual
  laya:
    model: multilingual         # convaiinnovations/laya + Revision multilingual
    max_len: 1024
    preload: false
  # --- slm/hybrid/auto: diese beiden Bloecke einkommentieren -------------
  # slm:
  #   base_url: "${RR_ROUTER_SLM_BASE_URL}"
  #   api_key: "${RR_ROUTER_SLM_API_KEY}"
  #   model: "${RR_ROUTER_SLM_MODEL}"
  # hybrid:
  #   strategy: auto              # auto | cascade | committee
  #   aggregate: mean             # committee: mean | product | max | primary
  # calibration:
  #   enabled: true
  #   cache: ./.rag-router-calibration.json
  #   questions: null             # null = mitgelieferter Kalibrierungssatz
  #   max_questions: 64
  # ----------------------------------------------------------------------
  thresholds:
    skip: 0.60                  # auto | Zahl
    fanout: 0.55
    answer: 0.50
    rrf_k: 60                   # RRF-Konstante (AurumVector-Default)
  defaults:
    top_k: 5
    rerank: true                # bge-reranker-v2-m3 AKTIV
    embed:
      model: BAAI/bge-m3
      device: cpu
      batch_size: 16
rags:
  gemeinde:
    description: "Hausregeln und Verwaltung der Gemeinde Aldersbrunn"
    backend:
      type: lancedb
      db: ./data/lancedb
      table: gemeinde_chunks
    retriever: hybrid
    top_k: 3
    rerank: true
  firma:
    description: "Betriebsregeln der Firmen Haldensteg GmbH und Brunsiek Logistik"
    backend:
      type: lancedb
      db: ./data/lancedb
      table: firma_chunks
    retriever: hybrid
    top_k: 5
    rerank: false               # Beispiel einer per-rag-Abschaltung
  dienste:
    description: "IT-Dienste und Tarife des Providers Quellnetz"
    backend:
      type: lancedb
      db: ./data/lancedb
      table: dienste_chunks
    retriever: hybrid
    top_k: 4
